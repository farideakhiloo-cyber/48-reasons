<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>۴۸ دلیل برای تو ❤️</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #fdf2f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card-container { width: 90%; max-width: 500px; background: white; padding: 40px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; min-height: 350px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        /* استایل عناوین و متن‌ها */
        #title { color: #db2777; font-size: 50px; margin: 0 0 10px 0; }
        #subtitle { color: #666; font-size: 16px; margin: 0 0 20px 0; }
        #content { color: #444; font-size: 18px; line-height: 1.8; margin-bottom: 30px; }
        
        .nav-buttons { margin-top: auto; display: flex; gap: 20px; padding-top: 20px; }
        button { background: #db2777; color: white; border: none; padding: 10px 25px; border-radius: 10px; cursor: pointer; font-size: 16px; transition: background 0.3s; }
        button:hover { background: #be185d; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="card-container" id="card">
        <h1 id="title">❤️</h1>
        <div id="subtitle"></div>
        <p id="content">تولدت مبارک عشق من</p>
        <div class="nav-buttons">
            <button id="prevBtn" onclick="prev()">قبلی</button>
            <button id="nextBtn" onclick="next()">بعدی</button>
        </div>
    </div>
    <script>
        const reasons = [
            `چون برای به دست آوردن من، یک سال و نیم کم نیاوردی! واقعاً نمی‌دونم این همه سماجتو از کجا آورده بودی.`,
            `چون برای یبار بیرون رفتن با من، حاضر بودی اون همکارای نچسب رو مهمون کنی! نقشه‌ات خیلی پرهزینه بود.`,
            `چون قبل از اینکه دوست‌پسرم باشی، بهترین همکار و حامی من بودی.`,
            `چون خیلی چیزا یادم دادی و من هنوز دارم از آموزش‌های آقا معلم استفاده می‌کنم.`,
            `چون موفقیت من برات واقعاً مهمه، نه فقط در حد حرف.`,
            `چون همیشه یک قدم جلوتر از خودم، به نیازهام فکر می‌کنی.`,
            `چون گاهی چیزایی برام می‌خری که خودم هنوز نفهمیدم بهشون احتیاج دارم!`,
            `چون یه سنسور مخفی داری، هرچقدرم من پنهان کنم اما تو حال بد منو می‌فهمی.`,
            `چون می‌تونم هیچی نگم و تو باز بفهمی یه چیزی شده.`,
            `چون وقتی حالم بده، تا خوب نشم ول‌کن نیستی. واقعاً گاهی دلم می‌خواد بگم: باشه بابا، خوب شدم.`,
            `چون مسیر تهران تا کرجو تبدیل کردی به زمان اختصاصی خودمون.`,
            `چون زنگ می‌زنی تا مسیر برام کوتاه‌تر بشه؛ و بعضی وقت‌ها اصلاً متوجه نمی‌شم کی رسیدم.`,
            `چون خیلی وقتا کلی رانندگی می‌کردی فقط برای اینکه من بتونم استراحت کنم.`,
            `چون برای استراحت منم برنامه‌ریزی می‌کنی! ماساژ، ناهار، استراحت... آقا من خودم هم نمی‌تونم این‌قدر به خودم برسم.`,
            `چون حتی وقتی کنارم نیستی، باز حواست هست که من خوش بگذرونم.`,
            `چون بلدی مراقبت کنی.`,
            `چون همیشه دنبال راهی هستی که زندگی من کمی راحت‌تر بشه.`,
            `چون وقتی مشکلی دارم، فقط نمی‌گی «نگران نباش»؛ واقعاً می‌شینی و فکر می‌کنی چه کارش کنیم.`,
            `چون گاهی بیشتر از خودم به فکر خودم هستی.`,
            `چون یه جور عجیبی حواست به جزئیات منه.`,
            `چون وقتی با تو حرف می‌زنم، فقط شنونده نیستی؛ مشاور، تحلیلگر و گاهی هم کمی رئیس!`,
            `چون خیلی چیزا به من یاد دادی که فقط مربوط به کار نبود.`,
            `چون باعث شدی بفهمم درخواست کمک کردن، ضعف نیست.`,
            `چون به من یاد دادی لازم نیست همیشه همه‌چیز رو خودم به تنهایی حل کنم.`,
            `چون من که همیشه عادت داشتم مراقب همه باشم، کنار تو یاد گرفتم گاهی خودم هم باید مراقبت بشم.`,
            `چون کمک کردی سعی کنم نیازهام رو بگم (البته فقط به تو تونستم بگم).`,
            `چون به من یاد دادی «خواستن» چیز بدی نیست.`,
            `چون کاری کردی احساس کنم حق دارم گاهی فقط یک زن باشم؛ نه مسئول حل مشکلات کل دنیا!`,
            `چون همیشه به من یادآوری می‌کنی که زیبا هستم.`,
            `چون انقدر از خوبی‌هام می‌گی که بعضی وقت‌ها خودم هم باورم می‌شه!`,
            `چون هنوز هم قربون صدقه‌ام می‌ری و انگار قرار نیست به این زودی‌ها خسته بشی.`,
            `چون نگاهت به من باعث شده خودم رو بیشتر دوست داشته باشم.`,
            `چون محبتت فقط وقتی کنار منی نیست؛ از راه دور هم حواست به من هست.`,
            `چون برای خوشحال کردن من، فقط پول خرج نمی‌کنی؛ وقت و انرژی و حوصله هم خرج می‌کنی.`,
            `چون حتی وقتی خودت خسته‌ای، باز هم به فکر راحتی منی.`,
            `چون کنار تو احساس امنیت دارم.`,
            `چون می‌دونم اگر روز سختی داشته باشم، یک نفر هست که واقعاً پشتمه.`,
            `چون از اون مردهایی هستی که «حرف» و «عمل»شون خیلی به هم نزدیکه.`,
            `چون جنتلمن بودنت فقط توی لباس پوشیدن و رفتار اجتماعی نیست؛ توی مدل دوست داشتن من هم هست.`,
            `چون حتی در خصوصی‌ترین لحظه‌ها هم حواست به راحتی و حال خوب من هست.`,
            `چون برات مهمه من کنار تو احساس خوبی داشته باشم.`,
            `چون وقتی چیزی رو دوست دارم، خوشحالی من برای تو تبدیل می‌شه به یک پروژه!`,
            `چون اگه چیزی بتونه زندگی من رو راحت‌تر کنه، احتمالاً قبل از خودم تو پیداش کردی.`,
            `چون دو سال گذشته و هنوز هم برای خوشحال کردن من ذوق داری.`,
            `چون وقتی گرسنمه مثل یه سوپرمن وارد عمل میشی تا قبل از اینکه بخورمت منو سیر کنی!`,
            `چون در کنار تو فهمیدم تکیه کردن، از قوی بودن کم نمی‌کنه.`,
            `چون تو فقط معشوق من نیستی؛ رفیق، حامی، مشاور، هم‌صحبت و شریک حال خوب منی.`,
            `چون اگه قرار باشه برای تمام چیزهایی که تو این دو سال به زندگی من اضافه کردی دلیل بنویسم، ۴۸ کارت هم کمه.`
        ];
        
        let index = -1; // -1 یعنی صفحه شروع، 0 تا 47 یعنی دلایل، 48 یعنی صفحه آخر
        
        function update() {
            const title = document.getElementById('title');
            const subtitle = document.getElementById('subtitle');
            const content = document.getElementById('content');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            // مدیریت صفحه شروع
            if(index === -1) {
                title.innerText = "❤️";
                subtitle.innerText = "۴۸ بهانه برای دوست داشتنت";
                content.innerText = "تولدت مبارک عشق من";
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'inline-block';
            } 
            // مدیریت صفحه آخر (کارت 49)
            else if (index === 48) {
                title.innerText = "❤️";
                subtitle.innerText = "";
                content.innerHTML = `تولدت مبارک مردی که اومدی و به من یاد دادی<br>گاهی لازم نیست همه‌چیز رو خودم به تنهایی به دوش بکشم<br><br><span style="font-size: 50px;">❤️</span>`;
                prevBtn.style.display = 'inline-block';
                nextBtn.style.display = 'none';
            }
            // مدیریت دلایل
            else {
                title.innerText = (index + 1);
                subtitle.innerText = "";
                content.innerText = reasons[index];
                prevBtn.style.display = 'inline-block';
                nextBtn.style.display = 'inline-block';
            }
        }
        function next() { if(index < 48) { index++; update(); } }
        function prev() { if(index > -1) { index--; update(); } }
    </script>
</body>
</html>
