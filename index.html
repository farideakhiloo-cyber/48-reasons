<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>۴۸ دلیل برای تو ❤️</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #fdf2f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card-container { width: 90%; max-width: 500px; background: white; padding: 40px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; min-height: 300px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        h1 { color: #db2777; font-size: 24px; margin-bottom: 20px; min-height: 30px; } /* برای جلوگیری از پرش صفحه */
        p { color: #444; font-size: 18px; line-height: 1.6; }
        .nav-buttons { margin-top: 30px; display: flex; gap: 20px; }
        button { background: #db2777; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 16px; transition: background 0.3s; }
        button:hover { background: #be185d; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="card-container" id="card">
        <h1 id="title">تولدت مبارک عشق من! ❤️</h1>
        <p id="content">۴۸ بهانه برای دوست داشتنت ❤️</p>
        <div class="nav-buttons">
            <button id="prevBtn" onclick="prev()">قبلی</button>
            <button id="nextBtn" onclick="next()">بعدی</button>
        </div>
    </div>

    <script>
        const reasons = [
            `چون برای به دست آوردن من، یک سال و نیم کم نیاوردتی! واقعاً نمی‌دونم این همه سماجتو از کجا آورده بودی😄`,
            `چون برای یبار بیرون رفتن با من، حاضر بودی اون همکارای نچسب رو مهمون کنی! نقشه‌ات خیلی پرهزینه بود😂`,
            `چون قبل از اینکه دوست‌پسرم باشی، بهترین همکار و حامی من بودی.`,
            `چون خیلی چیزا یادم دادی و من هنوز دارم از آموزش‌های آقا معلم استفاده می‌کنم😉.`,
            `چون موفقیت من برات واقعاً مهمه، نه فقط در حد حرف.`,
            `چون همیشه یک قدم جلوتر از خودم، به نیازهام فکر می‌کنی.`,
            `چون گاهی چیزایی برام می‌خری که خودم هنوز نمی‌فهمم بهشون احتیاج دارم!`,
            `چون یه سنسور مخفی داری، هرچقدرم من پنهان کنم اما تو حال بد منو می‌فهمی.`,
            `چون می‌تونم هیچی نگم و تو باز بفهمی یه چیزی شده.`,
            `چون وقتی حالم بده، تا خوب نشم ول‌کن نیستی. واقعاً گاهی دلم می‌خواد بگم: باشه بابا، خوب شدم😂`,
            `چون مسیر تهران تا کرجو تبدیل کردی به زمان اختصاصی خودمون.`,
            `چون زنگ می‌زنی تا مسیر برام کوتاه‌تر بشه؛ و بعضی وقت‌ها اصلاً متوجه نمی‌شم کی رسیدم.`,
            `چون خیلی وقتا کلی رانندگی می‌کردی فقط برای اینکه من بتونم استراحت کنم. (البته خودتم دلت می‌خواست بمالیااااا 😂)`,
            `چون برای استراحت منم برنامه‌ریزی می‌کنی! ماساژ، ناهار، استراحت... آقا من خودم هم نمی‌توانم این‌قدر به خودم برسم😄`,
            `چون همیشه کنارم هستی.`,
            `چون وقتی مشکلی دارم، فقط نمی‌گی «نگران نباش»؛ واقعاً می‌شینی و فکر می‌کنی چه کارش کنیم.`,
            `چون گاهی بیشتر از خودم به فکر خودم هستی.`,
            `چون یه جور عجیبی حواست به جزئیات منه.`,
            `چون وقتی با تو حرف می‌زنم، فقط شنونده نیستی؛ مشاور، تحلیلگر و گاهی هم کمی رئیس😄`,
            `چون خیلی چیزا به من یاد دادی که فقط مربوط به کار نبود.`,
            `چون باعث شدی بفهمم درخواست کمک کردن، ضعف نیست.`,
            `چون به من یاد دادی لازم نیست همیشه همه‌چیز رو خودم به تنهایی حل کنم.`,
            `چون کنار تو احساس امنیت دارم.`,
            `چون وقتی مشکلی دارم، همیشه حواست هست.`,
            `چون به من یاد دادی «خواستن» چیز بدی نیست.`,
            `چون کاری کردی احساس کنم حق دارم گاهی فقط یک زن باشم؛ نه مسئول حل مشکلات کل دنیا😄!`,
            `چون همیشه به من یادآوری می‌کنی که زیبا هستم.`,
            `چون انقدر از خوبی‌هام می‌گی که بعضی وقت‌ها خودم هم باورم می‌شه😌!`,
            `چون هنوز هم قربون صدقه ام می‌ری.`,
            `چون نگاهت به من باعث شده خودم رو بیشتر دوست داشته باشم.`,
            `چون محبتت فقط وقتی کنارم نیستی نیست.`,
            `چون حتی وقتی خودت خسته‌ای، باز هم به فکر راحتی منی.`,
            `چون برای خوشحال کردن من، فقط پول خرج نمی‌کنی؛ وقت و انرژی هم خرج می‌کنی.`,
            `چون وقتی گرسنمه مثل یه سوپرمن وارد عمل میشی تا قبل از اینکه بخورمت منو سیر کنی😂!`,
            `چون تو فقط معشوق من نیستی؛ رفیق، حامی، مشاور و شریک حال خوب منی.`,
            `چون تو کاری کردی که من بفهمم دوست داشته شدن فقط «دوستت دارم» شنیدن نیست.`,
            `تولدت مبارک عشق من ❤️`
        ];

        // از این به بعد از این آرایه برای نمایش استفاده می‌شود
        // index 0 یعنی اولین دلیل (کارت دوم بعد از کارت شروع)
        let index = -1; 

        const titleEl = document.getElementById('title');
        const contentEl = document.getElementById('content');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        function update() {
            // ۱. مدیریت کارت شروع (Index -1)
            if (index === -1) {
                titleEl.innerText = "تولدت مبارک عشق من! ❤️";
                contentEl.innerText = "۴۸ بهانه برای دوست داشتنت ❤️";
                prevBtn.classList.add('hidden'); // حذف دکمه قبلی
                nextBtn.classList.remove('hidden'); // نمایش دکمه بعدی
                return;
            }

            // ۲. مدیریت کارت‌های میانی و آخر
            // نمایش شماره (به جز کارت آخر)
            if (index === reasons.length - 1) {
                titleEl.innerText = ""; // حذف شماره در کارت آخر
            } else {
                titleEl.innerText = (index + 1);
            }

            // نمایش متن دلیل
            contentEl.innerText = reasons[index];

            // مدیریت دکمه‌ها بر اساس موقعیت
            if (index === 0) {
                prevBtn.classList.add('hidden'); // اگر اولین دلیل است، دکمه قبلی حذف شود
                nextBtn.classList.remove('hidden');
            } else if (index === reasons.length - 1) {
                prevBtn.classList.remove('hidden'); // در کارت آخر فقط دکمه قبلی باشد
                nextBtn.classList.add('hidden');
            } else {
                prevBtn.classList.remove('hidden');
                nextBtn.classList.remove('hidden');
            }
        }

        function next() {
            if (index < reasons.length - 1) {
                index++;
                update();
            }
        }

        function prev() {
            if (index > -1) {
                index--;
                update();
            }
        }

        // اجرای اولیه برای تنظیم دکمه‌ها در حالت شروع
        update();
    </script>
</body>
</html>
