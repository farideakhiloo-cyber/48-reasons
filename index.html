<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>۴۸ دلیل برای تو ❤️</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background-color: #fdf2f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card-container { width: 90%; max-width: 500px; background: white; padding: 40px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; min-height: 300px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        h1 { color: #db2777; font-size: 24px; margin-bottom: 20px; }
        p { color: #444; font-size: 18px; line-height: 1.6; }
        .nav-buttons { margin-top: 30px; display: flex; gap: 20px; }
        button { background: #db2777; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 16px; transition: background 0.3s; }
        button:hover { background: #be185d; }
    </style>
</head>
<body>
    <div class="card-container" id="card">
        <h1 id="title">تولدت مبارک عشق من! ❤️</h1>
        <p id="content">۴۸ بهانه برای دوست داشتنت ❤️<br>بزن روی دکمه بعدی...</p>
        <div class="nav-buttons">
            <button onclick="prev()">قبلی</button>
            <button onclick="next()">بعدی</button>
        </div>
    </div>
    <script>
        const reasons = [
            `۱. چون برای به دست آوردن من، یک سال و نیم کم نیاوردی! واقعاً نمی‌دونم این همه سماجتو از کجا آورده بودی😄`,
            `۲. چون برای یبار بیرون رفتن با من، حاضر بودی اون همکارای نچسب رو مهمون کنی! نقشه‌ات خیلی پرهزینه بود😂`,
            `۳. چون قبل از اینکه دوست‌پسرم باشی، بهترین همکار و حامی من بودی.`,
            `۴. چون خیلی چیزا یادم دادی و من هنوز دارم از آموزش‌های آقا معلم استفاده می‌کنم😉.`,
            `۵. چون موفقیت من برات واقعاً مهمه، نه فقط در حد حرف.`,
            `۶. چون همیشه یک قدم جلوتر از خودم، به نیازهام فکر می‌کنی.`,
            `۷. چون گاهی چیزایی برام می‌خری که خودم هنوز نفهمیدم بهشون احتیاج دارم!`,
            `۸. چون یه سنسور مخفی داری، هرچقدرم من پنهان کنم اما تو حال بد منو می‌فهمی.`,
            `۹. چون می‌تونم هیچی نگم و تو باز بفهمی یه چیزی شده.`,
            `۱۰. چون وقتی حالم بده، تا خوب نشم ول‌کن نیستی. واقعاً گاهی دلم می‌خواد بگم: باشه بابا، خوب شدم😂`,
            `۱۱. چون مسیر تهران تا کرجو تبدیل کردی به زمان اختصاصی خودمون.`,
            `۱۲. چون زنگ می‌زنی تا مسیر برام کوتاه‌تر بشه؛ و بعضی وقت‌ها اصلاً متوجه نمی‌شم کی رسیدم.`,
            `۱۳. چون خیلی وقتا کلی رانندگی می‌کردی فقط برای اینکه من بتونم استراحت کنم. (البته خودتم دلت می‌خواست بمالیااااا 😂)`,
            `۱۴. چون برای استراحت منم برنامه‌ریزی می‌کنی! ماساژ، ناهار، استراحت... آقا من خودم هم نمی‌توانم این‌قدر به خودم برسم😄`,
            `۱۵. چون حتی وقتی کنارم نیستی، باز حواست هست که من خوش بگذرونم.`,
            `۱۶. چون بلدی مراقبت کنی.`,
            `۱۷. چون همیشه دنبال راهی هستی که زندگی من کمی راحت‌تر بشه.`,
            `۱۸. چون وقتی مشکلی دارم، فقط نمی‌گی «نگران نباش»؛ واقعاً می‌شینی و فکر می‌کنی چه کارش کنیم.`,
            `۱۹. چون گاهی بیشتر از خودم به فکر خودم هستی.`,
            `۲۰. چون یه جور عجیبی حواست به جزئیات منه.`,
            `۲۱. چون وقتی با تو حرف می‌زنم، فقط شنونده نیستی؛ مشاور، تحلیلگر و گاهی هم کمی رئیس😄`,
            `۲۲. چون خیلی چیزا به من یاد دادی که فقط مربوط به کار نبود.`,
            `۲۳. چون باعث شدی بفهمم درخواست کمک کردن، ضعف نیست.`,
            `۲۴. چون به من یاد دادی لازم نیست همیشه همه‌چیز رو خودم به تنهایی حل کنم.`,
            `۲۵. چون من که همیشه عادت داشتم مراقب همه باشم، کنار تو یاد گرفتم گاهی خودم هم باید مراقبت بشم.`,
            `۲۶. چون کمک کردی سعی کنم نیازهام رو بگم (البته فقط به تو تونستم بگم)😄.`,
            `۲۷. چون به من یاد دادی «خواستن» چیز بدی نیست.`,
            `۲۸. چون کاری کردی احساس کنم حق دارم گاهی فقط یک زن باشم؛ نه مسئول حل مشکلات کل دنیا😄!`,
            `۲۹. چون همیشه به من یادآوری می‌کنی که زیبا هستم.`,
            `۳۰. چون انقدر از خوبی‌هام می‌گی که بعضی وقت‌ها خودم هم باورم می‌شه😌!`,
            `۳۱. چون هنوز هم قربون صدقه‌ام می‌ری و انگار قرار نیست به این زودی‌ها خسته بشی. خودت خواستی، حالا تحمل کن. 😂.`,
            `۳۲. چون نگاهت به من باعث شده خودم رو بیشتر دوست داشته باشم.`,
            `۳۳. چون محبتت فقط وقتی کنار منی نیست؛ از راه دور هم حواست به من هست.`,
            `۳۴. چون برای خوشحال کردن من، فقط پول خرج نمی‌کنی؛ وقت و انرژی و حوصله هم خرج می‌کنی.`,
            `۳۵. چون حتی وقتی خودت خسته‌ای، باز هم به فکر راحتی منی.`,
            `۳۶. چون کنار تو احساس امنیت دارم.`,
            `۳۷. چون می‌دونم اگر روز سختی داشته باشم، یک نفر هست که واقعاً پشتمه.`,
            `۳۸. چون از اون مردهایی هستی که «حرف» و «عمل»شون خیلی به هم نزدیکه.`,
            `۳۹. چون جنتلمن بودنت فقط توی لباس پوشیدن و رفتار اجتماعی نیست؛ توی مدل دوست داشتن من هم هست.`,
            `۴۰. چون حتی در خصوصی‌ترین لحظه‌ها هم حواست به راحتی و حال خوب من هست❤️.`,
            `۴۱. چون برات مهمه من کنار تو احساس خوبی داشته باشم.`,
            `۴۲. چون وقتی چیزی رو دوست دارم، خوشحالی من برای تو تبدیل می‌شه به یک پروژه😂!`,
            `۴۳. چون اگه چیزی بتونه زندگی من رو راحت‌تر کنه، احتمالاً قبل از خودم تو پیدایش کردی.`,
            `۴۴. چون دو سال گذشته و هنوز هم برای خوشحال کردن من ذوق داری.`,
            `۴۵. چون وقتی گرسنمه مثل یه سوپرمن وارد عمل میشی تا قبل از اینکه بخورمت منو سیر کنی😂!`,
            `۴۶. چون در کنار تو فهمیدم تکیه کردن، از قوی بودن کم نمی‌کنه.`,
            `۴۷. چون تو فقط معشوق من نیستی؛ رفیق، حامی، مشاور، هم‌صحبت و شریک حال خوب منی.`,
            `۴۸. چون تو کاری کردی که من بفهمم دوست داشته شدن فقط «دوستت دارم» شنیدن نیست؛ یعنی یکی حواسش به خستگیت، گرسنگیت، مسیر برگشتنت، آرامشت و حتی چیزهایی که خودت هنوز نمی‌دونی لازم داری باشه. تولدت مبارک مردی که اومدی و به من یاد دادی گاهی لازم نیست همه‌چیز را خودم به تنهایی به دوش بکشم. ❤️`
        ];
        
        let index = -1;
        function update() {
            const title = document.getElementById('title');
            const content = document.getElementById('content');
            if(index === -1) {
                title.innerText = "تولدت مبارک عشق من! ❤️";
                content.innerHTML = "۴۸ بهانه برای دوست داشتنت ❤️<br>";
            } else {
                title.innerText = (index + 1);
                content.innerText = reasons[index];
            }
        }
        function next() { if(index < reasons.length - 1) { index++; update(); } }
        function prev() { if(index > -1) { index--; update(); } }
    </script>
</body>
</html>
